<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anish | Profile Status</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg);
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }

        /* Animated Background Particles */
        .bg-animate {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            z-index: -1;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 320px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1s ease-out;
        }

        /* Profile Image / Icon Area */
        .profile-pic {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            position: relative;
        }

        /* Online Status Pulse */
        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 15px;
            height: 15px;
            background: #22c55e;
            border-radius: 50%;
            border: 3px solid #1e293b;
            animation: pulse 2s infinite;
        }

        h1 {
            margin: 10px 0;
            font-size: 28px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-text {
            color: var(--primary);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            display: block;
            animation: glow 3s infinite alternate;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            text-align: left;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-radius: 12px;
            border-left: 3px solid var(--secondary);
            transition: 0.3s;
        }

        .info-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(10px);
        }

        .label {
            display: block;
            font-size: 10px;
            color: #64748b;
            text-transform: uppercase;
        }

        .value {
            font-size: 16px;
            font-weight: 500;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px var(--primary); }
            to { text-shadow: 0 0 15px var(--secondary); }
        }
    </style>
</head>
<body>

    <div class="bg-animate"></div>

    <div class="card">
        <div class="profile-pic">
            A
            <div class="status-dot"></div>
        </div>
        
        <h1>Anish</h1>
        <span class="status-text">Developer Profile</span>

        <div class="info-grid">
            <div class="info-item">
                <span class="label">Age</span>
                <span class="value">15 Years Old</span>
            </div>
            <div class="info-item">
                <span class="label">Location</span>
                <span class="value">Kanchanpur, Nepal</span>
            </div>
            <div class="info-item">
                <span class="label">Status</span>
                <span class="value">Ready for Grade 9</span>
            </div>
        </div>
    </div>

</body>
</html>
